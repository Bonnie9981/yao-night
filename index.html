<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body><title>曜光之夜 手機終端</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 版面：桌機置中一支手機（DM 後台放寬成平板寬）；手機寬度時整個畫面就是手機。單一夜色主題。 */
:root{
  color-scheme: dark;
  --night:#0d1416; --fog:#1b2a2e; --glass:rgba(220,236,240,.08); --line:rgba(200,225,232,.16);
  --ink:#e6eff1; --mute:#93a7ac; --amber:#f0b45a; --alert:#ff6b5e; --ok:#6fd3a8; --violet:#b48cff;
  --paper:#fbfdfd; --paper-ink:#1d5f8a; --paper-line:#5fb3d9;
  --f-hand:"LXGW WenKai TC","Kaiti TC","KaiTi","STKaiti",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:center;padding-block:16px;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input,select,textarea{font:inherit}

.phone{position:relative;width:100%;max-width:400px;height:min(820px,100%);border-radius:38px;overflow:hidden;
  background:radial-gradient(120% 60% at 20% 0%,rgba(240,180,90,.18),transparent 60%),radial-gradient(90% 50% at 90% 100%,rgba(95,179,217,.14),transparent 60%),linear-gradient(180deg,#132024 0%,#0b1113 100%);
  border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.55);display:flex;flex-direction:column;transition:max-width .25s}
.phone.wide{max-width:960px;border-radius:22px}
.phone::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;background:repeating-linear-gradient(104deg,transparent 0 9px,rgba(255,255,255,.035) 9px 10px)}
.status{display:flex;justify-content:space-between;align-items:center;padding:14px 26px 6px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;position:relative;z-index:3}
.status .sig{display:flex;gap:6px;align-items:center;color:var(--mute);font-weight:500}
.status .sync{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.status .sync.on{background:var(--ok)}
.screen{position:relative;flex:1;min-height:0;z-index:2}

.lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:40px 28px;text-align:center;gap:10px}
.lock .big{font-size:64px;font-weight:300;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1}
.lock .date{color:var(--mute);font-size:14px}
.lock .venue{margin-top:22px;font-family:var(--f-hand);font-size:20px;color:var(--amber);letter-spacing:.12em}
.lock .weather{font-size:12px;color:var(--mute)}
.lock form{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:10px}
.lock label{font-size:13px;color:var(--mute);text-align:left}
.keyin{display:flex;gap:8px}
.keyin input{flex:1;min-width:0;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);font-family:var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.btn{background:var(--amber);color:#2a1a04;border-radius:14px;padding:12px 16px;font-weight:700}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--alert);color:#2b0703}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.err{color:var(--alert);font-size:13px;min-height:18px;text-align:left}
.demo{font-size:12px;color:var(--mute);text-align:left;line-height:1.7;border-top:1px dashed var(--line);padding-top:10px}
.demo code{font-family:var(--f-mono);color:var(--ink)}

.home{position:absolute;inset:0;padding:18px 22px 24px;display:flex;flex-direction:column;gap:18px;background:radial-gradient(60% 40% at 80% 85%,rgba(240,180,90,.14),transparent 70%),radial-gradient(50% 30% at 10% 20%,rgba(95,179,217,.12),transparent 70%)}
.who{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:10px 12px}
.who{display:flex;align-items:center;gap:12px}
.who .ava{width:44px;height:44px;border-radius:50%;background:var(--fog);border:1px solid var(--line);overflow:hidden;flex:none;display:grid;place-items:center;font-size:11px;color:var(--mute)}
.who .ava img,.who .ava svg{width:100%;height:100%;object-fit:cover;display:block}
.who b{display:block;font-size:15px}
.who span{font-size:12px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 10px;align-content:start}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:var(--ink);text-align:center}
.ico{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 14px rgba(0,0,0,.35)}
.ico svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-5px;right:-5px;background:var(--alert);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 6px}
.dock{margin-top:auto;display:flex;justify-content:space-around;background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:12px 8px}
.hbtns{margin-left:auto;display:flex;gap:6px;align-items:center}
.pager{display:flex;gap:4px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:3px}
.pager button{flex:1;padding:7px 6px;border-radius:9px;font-size:13px;color:var(--mute)}
.pager button[aria-selected="true"]{background:var(--amber);color:#2a1a04;font-weight:700}
.ibtn{position:relative;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.ibtn .cnt{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:#ff3b30;color:#fff;font-size:10px;display:grid;place-items:center;padding:0 3px}
.widget{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.widget small{display:block;color:var(--mute);font-size:11px}.widget b{font-size:14px}
.ico .dot,.dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:#ff3b30;border:2px solid #0f181b}
.dot.sm{position:static;display:inline-block;width:8px;height:8px;border:0;margin-right:5px;vertical-align:middle}
.zhint{color:var(--amber);font-size:10.5px}
.onb{position:absolute;inset:0;z-index:50;background:rgba(5,8,10,.72);display:grid;place-items:center;padding:24px}
.onbcard{background:#13202a;border:1px solid var(--line);border-radius:20px;padding:20px;max-width:320px}.onbcard small{color:var(--mute)}.onbcard h3{margin:6px 0 8px;font-size:18px;color:var(--amber)}.onbcard p{line-height:1.7;font-size:14.5px;margin:0 0 14px}
.onbbtns{display:flex;justify-content:space-between}
.netbar{position:absolute;left:12px;right:12px;bottom:12px;z-index:60;background:#5a1f1a;color:#ffd9d4;border-radius:12px;padding:10px 12px;font-size:13px}
.msg{font-size:calc(14px * var(--fz,1))!important}.note p{font-size:calc(14px * var(--fz,1))!important}.doc p{font-size:calc(15.5px * var(--fz,1))!important}.phdesc{font-size:calc(14.5px * var(--fz,1))!important}.brief p,.brief ol{font-size:calc(14.5px * var(--fz,1))!important}.log span{font-size:calc(13px * var(--fz,1))}
.toast{pointer-events:none}
.phone.wide .toast{top:auto;bottom:16px;left:auto;right:16px;max-width:380px}
.banner{background:#2b2414;border:1px solid #5a4a22;color:#f7dfae;border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.5}
.banner b{display:block;color:var(--amber);font-size:12px;margin-bottom:2px}

.win{position:absolute;inset:0;background:#0f181b;display:flex;flex-direction:column;z-index:5;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.win,.toast{animation:none}}
.bar{display:flex;align-items:center;gap:8px;padding:8px 14px 10px;border-bottom:1px solid var(--line)}
.bar button{color:var(--amber);font-size:15px;padding:4px 6px}
.bar h2{font-size:16px;margin:0;flex:1;text-align:center;padding-right:44px}
.body{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 28px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row .t{flex:1;min-width:0}
.row b{display:block;font-size:14.5px}
.row small{display:block;color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row time{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.circle{width:40px;height:40px;border-radius:50%;background:var(--fog);display:grid;place-items:center;font-size:14px;flex:none;border:1px solid var(--line)}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:9px 12px;border-radius:16px;font-size:14px;line-height:1.5;background:var(--fog);align-self:flex-start;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:#2f5e6b}
.msg .tm{display:block;font-size:10.5px;color:var(--mute);margin-top:3px;font-variant-numeric:tabular-nums}
.day{align-self:center;font-size:11px;color:var(--mute);margin:6px 0}
.note{background:#1b2629;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.note h3{margin:0 0 6px;font-size:15px}
.note p{margin:0;font-size:14px;line-height:1.65;color:#d5e2e5;white-space:pre-wrap}
.note .meta{font-size:11.5px;color:var(--mute);margin-bottom:8px}

.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumb{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#111;text-align:left}
.thumb .cap{font-size:11.5px;color:var(--mute);padding:6px 8px;font-variant-numeric:tabular-nums}
.pic{aspect-ratio:3/4;max-width:100%;position:relative;overflow:hidden}
.big .pic{border-radius:14px}
.zoomwrap{overflow:auto;border-radius:14px;border:1px solid var(--line);max-height:62vh}
.zoomwrap .pic{transform-origin:0 0}
.zoomctl{display:flex;gap:8px;margin:10px 0}

/* 照片：雨夜停車場等，用 CSS 畫 */
.rainy{background:linear-gradient(180deg,#0a0f12,#18242a 60%,#0d1214)}
.rainy::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 14px,rgba(200,230,240,.09) 14px 15px)}
.lampglow{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--amber);filter:blur(3px);box-shadow:0 0 40px 20px rgba(240,180,90,.32)}
.car{position:absolute;border-radius:12px 12px 6px 6px;background:linear-gradient(180deg,#2b3439,#151b1e)}
.car .tl{position:absolute;bottom:22%;width:16%;height:9%;background:#ff4a3a;border-radius:3px;box-shadow:0 0 14px #ff4a3a}
.car .plate{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);background:#e9ecdf;color:#111;font-family:var(--f-mono);font-weight:600;padding:2px 6px;border-radius:3px;font-size:9px;letter-spacing:.06em;white-space:nowrap;border:1px solid #333}
.car .head{position:absolute;top:18%;left:20%;right:20%;height:30%;background:rgba(240,200,120,.25);border-radius:6px}
.umb{position:absolute;width:30px;height:16px;border-radius:30px 30px 0 0;background:#1b1b1b;border:1px solid #444}
.umb::after{content:"";position:absolute;left:14px;top:14px;width:2px;height:22px;background:#333}
.stairs{position:absolute;background:repeating-linear-gradient(160deg,#3a3f42 0 6px,#23282b 6px 12px);border:1px solid #555}
.slotno{position:absolute;color:rgba(240,240,220,.75);font-family:var(--f-mono);font-size:12px}
.blocker{position:absolute;background:radial-gradient(circle at 40% 40%,#2a2a2a,#0b0b0b);border-radius:50%}
.couplepic{background:linear-gradient(160deg,#e8d9c7,#b9a38d);display:grid;place-items:center;color:#5a4634;font-family:var(--f-hand);font-size:18px;text-align:center;padding:12px}
.chatpic{background:#f2f2f2;color:#222;padding:10px;font-size:11px;line-height:1.5;display:flex;flex-direction:column;gap:6px}
.chatpic .b{background:#fff;border-radius:8px;padding:6px 8px;box-shadow:0 1px 0 #ddd}
.chatpic .b.r{background:#cfeec1;align-self:flex-end}
.stagepic{background:radial-gradient(60% 50% at 50% 30%,rgba(240,180,90,.55),transparent 70%),linear-gradient(180deg,#1a1410,#0b0a09)}
.stagepic .crowd{position:absolute;bottom:0;left:0;right:0;height:38%;background:repeating-radial-gradient(circle at 10% 100%,#111 0 10px,#1c1c1c 10px 20px)}
.lodgepic{background:linear-gradient(180deg,#22313a,#0e1519)}
.lodgepic .house{position:absolute;left:14%;right:14%;bottom:18%;height:44%;background:#1a2226;border:1px solid #3b4a50}
.lodgepic .win2{position:absolute;width:12%;height:10%;background:#f0c27a;opacity:.8}

/* 地圖 */
.maptabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.maptabs button{flex:1;min-width:60px;padding:8px;border-radius:10px;background:var(--glass);border:1px solid var(--line);font-size:13px}
.maptabs button[aria-selected="true"]{background:var(--amber);color:#2a1a04;border-color:transparent;font-weight:700}
.map{width:100%;height:auto;display:block;border-radius:14px;background:#13201f;border:1px solid var(--line)}
.legend{font-size:12.5px;color:var(--mute);line-height:1.7;margin-top:10px}

/* 電話 */
.dial{display:flex;flex-direction:column;align-items:center;gap:14px}
.dial .num{font-family:var(--f-mono);font-size:26px;min-height:38px;letter-spacing:.08em}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:14px 22px}
.pad button{width:64px;height:64px;border-radius:50%;background:var(--glass);border:1px solid var(--line);font-size:24px}
.callbtn{width:64px;height:64px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.callbtn svg{width:28px;height:28px;stroke:#073;fill:none;stroke-width:2}
.calling{position:absolute;inset:0;background:linear-gradient(180deg,#1c2b30,#0b1113);z-index:8;display:flex;flex-direction:column;align-items:center;padding:48px 22px 26px;gap:10px;text-align:center}
.calling .who2{font-size:24px}
.calling .st{color:var(--mute);font-size:14px}
.transcript{margin-top:14px;width:100%;text-align:left;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;min-height:0}
.transcript p{margin:0;font-size:14px;line-height:1.6;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.transcript p b{color:var(--amber)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{padding:8px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:13.5px}
.choices button[aria-pressed="true"]{background:#2f5e6b;border-color:var(--paper-line)}
.hang{width:64px;height:64px;border-radius:50%;background:var(--alert);display:grid;place-items:center;flex:none}
.hang svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;transform:rotate(135deg)}

.sys{font-family:var(--f-mono);font-size:13px}
.sys .hd{color:var(--amber);font-weight:600;margin-bottom:10px;letter-spacing:.04em}
.field{display:flex;gap:8px;margin:10px 0}
.field input{flex:1;min-width:0;background:#0b1214;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.result{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;line-height:1.8;background:#0b1214}
.result.hit{border-color:var(--amber)}
.log{display:flex;flex-direction:column}
.log div,.log button{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);line-height:1.5;text-align:left;width:100%}
.log time{color:var(--amber)}
.pin{background:#2b2414;border:1px solid #5a4a22;color:#f7dfae;border-radius:12px;padding:10px 12px;font-family:var(--f-body);font-size:13.5px;margin-bottom:12px}
.cctv{aspect-ratio:4/3;max-width:100%;background:#0a0d0e;border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden;margin:10px 0;filter:grayscale(1) contrast(1.1)}
.cctv .ts{position:absolute;top:6px;left:8px;font-family:var(--f-mono);font-size:11px;color:#ddd}
.cctv .rec{position:absolute;top:6px;right:8px;font-size:11px;color:#f55}
.cctv .fig{position:absolute;bottom:18%;width:16px;height:46px;border-radius:8px 8px 3px 3px;background:#bbb}
.cctv .fig::before{content:"";position:absolute;top:-14px;left:1px;width:14px;height:14px;border-radius:50%;background:#bbb}
.cctv .cap{position:absolute;bottom:6px;left:8px;right:8px;font-size:11px;color:#ccc;font-family:var(--f-body)}

/* 身分文件 */
.doc{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:26px 22px 24px;position:relative;font-family:var(--f-hand)}
.doc::before,.doc::after{content:"";position:absolute;width:38px;height:38px;border:2px solid var(--paper-line);pointer-events:none}
.doc::before{top:8px;left:8px;border-right:0;border-bottom:0}
.doc::after{bottom:8px;right:8px;border-left:0;border-top:0}
.doc .frame{position:absolute;inset:14px;border:1px solid rgba(95,179,217,.45);pointer-events:none}
.doc .ticks{position:absolute;top:16px;right:22px;font-family:var(--f-mono);color:var(--paper-line);letter-spacing:-.1em;font-size:12px}
.doc .head{display:flex;gap:14px;align-items:flex-start}
.doc .photo{width:84px;height:112px;border:1.5px dashed var(--paper-line);display:grid;place-items:center;text-align:center;font-size:12px;color:#6aa3c4;flex:none;overflow:hidden;background:#f1f8fb}
.doc .photo img,.doc .photo svg{width:100%;height:100%;object-fit:cover;display:block}
.doc .photo{border-style:solid;box-shadow:0 2px 0 rgba(29,95,138,.15)}
.doc h4{margin:14px 0 4px;font-size:17px;color:#123f5e;font-weight:700}
.doc .head h4{margin-top:0}
.doc p{margin:0;font-size:15.5px;line-height:1.85;white-space:pre-wrap}
.doc .key{font-size:14px;color:#123f5e}
.doc .key span{font-family:var(--f-mono);letter-spacing:.06em}
.doc .pname{font-size:14px;color:#123f5e;margin-top:4px}
.doc .hint{color:#3d7fa8}
.locked{border:1.5px dashed var(--paper-line);border-radius:8px;padding:12px;margin-top:6px;background:#f1f8fb}
.locked .q{font-size:15px;line-height:1.7;white-space:pre-wrap}
.locked .field input{background:#fff;color:#123f5e;border-color:#9fcde3}
.locked .btn{padding:10px 14px}
.solved{border-left:3px solid var(--paper-line);padding-left:10px}
.caution{font-size:12.5px;color:#7a5a1a;background:#fff4dd;border-radius:6px;padding:6px 8px;margin-top:8px;font-family:var(--f-body)}

/* 投票／揭曉 */
.vote{display:flex;flex-direction:column;gap:8px}
.vote label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--glass)}
.vote input{accent-color:var(--amber);width:18px;height:18px}
.reveal p{line-height:1.8;font-size:14.5px}

.scn{position:relative;background:#0b1012}
.scn svg{position:absolute;inset:0;width:100%;height:100%;display:block;transition:transform .5s ease}
.pic.zoomed svg,.pic.zoomed .phimg{transform:scale(1.9);transform-origin:60% 60%}

:"// 必須公開：23:07 在二樓男廁（掩護：衣服沾到飲料去洗）。","cover":"可以說「衣服沾到飲料，去洗一下」，不必提捅刀。","goal":"把刀和沾血的衣服處理掉；他深信是自己殺了曜曜。","clue":{"prompt":"你把今晚的事寫在一則上了圖形鎖的備忘錄裡，手在抖，畫完就忘了。\n提示在另一則備忘錄和相簿裡。圖形鎖的九個點由左上到右下編號 1～9，輸入你畫過的點的順序：","answers":["14789632"],"reveal":"（上鎖的備忘錄）\n23:05\n門沒鎖。裡面好暗，我在昏暗的燈光下走進去。\n沙發上有人側躺，臉朝椅背，身上蓋著外套。\n我捅下去了。\n他沒叫，也沒動。\n我伸手推他，碰到他的脖子，是涼的。冷氣開得好強。\n我跑出來才發現袖子上沾到扶手上的血。暗紅色的，摸起來半乾，黏黏的。\n洗不掉。洗不掉。\n我殺人了嗎？","solution":"備忘錄說圖形就是招牌上那個字、從左上角起、跟時鐘反方向畫一圈不回起點；招牌是「口」→ 1→4→7→8→9→6→3→2。"}},"messages":[{"with":"阿雄（以前店裡的師傅）","last":"你人在哪","items":[{"day":"10月16日"},{"t":"20:11","x":"老闆，最近還好嗎"},{"me":true,"t":"20:40","x":"還活著"},{"t":"20:41","x":"那個網紅不是要辦十週年？網路上一堆人在講"},{"me":true,"t":"20:45","x":"嗯"},{"day":"今天"},{"t":"22:30","x":"你今天怎麼都沒回"},{"t":"23:22","x":"你人在哪"}]},{"with":"老婆","last":"早點回來","items":[{"day":"今天"},{"t":"18:02","x":"你又要去山上那個活動？"},{"me":true,"t":"18:10","x":"去看一下就回來"},{"t":"18:11","x":"店都收了，你不要再去想那個人了"},{"t":"21:40","x":"下好大的雨，早點回來"}]}],"photos":[{"t":"2023/02","title":"一口麵","scene":"street","desc":"夜市裡的小吃店，紅色招牌上寫著店名，最中間是一個特大的「口」字，被框在正方形裡。"},{"t":"2023/04","title":"收店那天","scene":"street","desc":"鐵捲門拉下一半，門上貼著「感謝十二年來的照顧」。"},{"t":"22:52","title":"（誤觸）","scene":"night","desc":"很暗的照片，看得出是樓梯扶手和一段往上的樓梯。"},{"t":"10/16","title":"截圖","scene":"screen","desc":"曜曜的十週年見面會宣傳圖：10/18 霧岑會館。"}],"notes":[{"title":"鎖","meta":"今天 23:21","body":"剛剛那則鎖起來了。\n圖形就是我們家招牌正中間那個字。\n從左上角那個點開始。\n照我以前寫招牌的習慣，沿著外框繞，跟時鐘反方向，繞一圈，不用回到起點。"},{"title":"那支影片","meta":"2023年3月","body":"影片上傳第三天，店門口就有人來拍照、留一星。\n他根本沒來吃過。\n第二十八天，房東說不續約了。"},{"title":"🔒 今晚","meta":"今天 23:20","body":"（已上鎖）"},{"title":"8/16","meta":"8月16日","body":"今天去他台北工作室外面等，想當面問他記不記得一口麵。\n只拍到一群粉絲進進出出，被工作人員趕走。\n他連門都沒出來。"}],"contacts":["阿雄（以前店裡的師傅）","老婆"],"portrait":"img/p_C3.jpg"},{"id":"C4","key":"8029","title":"私生飯","apps":["doc","msg","phone","photo","note","map"],"doc":{"identity":"私生飯","background":"你跟著曜曜已經好幾年了。他住哪、去哪家健身房、幾點離開工作室，你都知道，也都寫在日記裡。\n你跑過他很多場活動，知道他的休息室門平常都不鎖。\n今晚 21:00 中場，曜曜上二樓休息室，你悄悄跟了上去，躲進二樓的儲藏室，門留一條縫往外看。你在裡面一直待到 21:42 才敢出來。那段時間，誰進出過休息室、誰在走廊上走動，你都 05","x":"妳回去了嗎"}]}],"photos":[{"t":"19:22","title":"霧岑會館","scene":"night","desc":"雨霧中的會館外觀，窗戶透出暖黃色燈光。"},{"t":"20:10","title":"舞台","scene":"stage","desc":"曜曜在台上揮手，台下很多人舉著手機。"},{"t":"21:32","title":"雨中的停車場","scene":"lot","desc":"雨夜的停車場。逃生梯下面停著一台車，車燈亮著。有個撐傘的人往會館側邊走，看不清臉。","zoom":"逃生梯下那台車停在 6 號車格，車牌只看得到前面「RBK-73」，後兩碼被雨刷和反光擋住。"},{"t":"23:01","title":"亮著燈的車","scene":"car","desc":"一台車的車尾，車牌 ATB-22□8，其中一個數字被雨傘擋住。車裡亮著車內燈。"},{"t":"10/10","title":"婚紗試拍","scene":"studio","desc":"你和曜曜的婚紗試拍照，他笑得很燦爛。"},{"t":"10/11","title":"截圖","scene":"doc","desc":"一份文件截圖：「契約期間 2024/03～2026/04，雙方須於社群公開互動，每月至少 4 則。甲方：曜光工作室。」"}],"notes":[{"title":"那台車","meta":"今天 23:04","body":"23:01 拍的車尾，最後四碼有一個數字被我自己的傘擋住了。\n記得那時順手算了一下，最後四個數字加起來剛好是 12，跟我們的結婚紀念日（12 月 12 日）一樣，還覺得很諷刺。"},{"title":"婚禮待辦","meta":"10月10日","body":"喜帖校稿\n試菜（他對花生過敏，記得跟飯店說）\n婚戒尺寸"}],"contacts":["曜曜","小晴（閨蜜）"],"portrait":"img/p_D5.jpg"},{"id":"D6","key":"8994","title":"徵信社偵探","apps":["doc","msg","phone","photo","note","map"],"doc":{"identity":"徵信社偵探","background":"你是徵信社的偵探，受 MCN 主管委託來挖曜曜的黑料，今晚偽裝成粉絲入場，車子也用粉絲的名字登記。你穿深色西裝外套，相機用一條藍色寬背帶掛在胸前。\n你的主要目標是曜曜的經紀人。21:00 中場一開始，你就回到停車場自己的車上，一直拍經紀人那台車，拍到 21:43 才撐傘從正門跑回大廳，外套肩膀都濕了，你在櫃台旁邊擦頭髮。雨很大，停車場另一頭有個女生一直坐在車上哭。\n23:00 直播結束，你又溜回停車場，拍到經紀人和你的委託人 MCN 主管坐在經紀人的車裡，車內燈亮著，兩人在簽文件。你拍到 23:08，趕回大廳入鏡了 23:10 的大合照。","intro":"// 必須公開：23:00 停車場有一台車亮著車內燈，裡面好像有人在談事情。","cover":"可以說「在拍會館夜景」，不必承認受雇。","goal":"把黑料交給委託人換錢；不想捲入命案。","clue":{"prompt":"委託人要你把「那一組」照片上傳到隱藏相簿，密碼是你們的老規矩。\n看 LINE 和備忘錄裡的監看速記，輸入 8 位數密碼：","answers":["22082300"],"reveal":"隱藏相簿「T-1018」已開啟。\n\n23:00～23:08 連拍 14 張：\n經紀人的車停在 4 號車格，車內燈亮著。駕駛座是經紀人，副駕駛座是 MCN 主管。兩個人輪流低頭，在同一份文件上寫東西，中間 MCN 主管把文件翻過來指給經紀人看。\n最後一張 23:08，經紀人把文件收進公事包。","solution":"LINE：密碼＝目標車牌的數字＋目標上車時間；速記 T＝經紀人、T車＝ATB-2208、「2300 T＋C 入 T車」→ 2208＋2300 → 22082300。"}},"messages":[{"with":"MCN 主管","last":"老規矩","items":[{"day":"10月16日"},{"t":"11:20","x":"週日那場，盯經紀人就好，曜曜那邊有拍到什麼也給我"},{"me":true,"t":"11:25","x":"了解，我登記成粉絲進去"},{"day":"今天"},{"t":"22:58","x":"等等我會跟他去車上，你拍清楚一點"},{"me":true,"t":"22:59","x":"收到"},{"me":true,"t 生」標籤的宵夜醬汁。21:10 從後門出去，回到停在逃生梯正下方的租車裡等。只有逃生梯這條路不會碰到人。\n21:32 撐傘下車，從逃生梯上二樓。21:35 走進休息室：曜曜倒在地上，抓著已解鎖的手機，正用 LINE 打給經紀人；急救筆已經不在他的包包裡。你從他手中拿走手機，把自動鎖定改成「永不」，因為你想看看他的備忘錄裡，有沒有一句對語涵的道歉。然後你站著，看著。\n21:40 他停止呼吸。你把他扶到沙發上，臉朝椅背側躺，蓋上外套，看起來像睡著了。你從逃生梯回到車上翻他的手機：備忘錄裡沒有任何道歉，只有一份「公關危機應對」，其中一行寫著「當年公審事件如果被翻出來，就推給小編。」你順手刪掉 21:27 撥 119 和 21:35 撥給經紀人的通話紀錄。21:45 你淋著雨從正門走回大廳，肩膀全濕了，說自己剛才在外面講工作電話。\n22:00 大螢幕開始「直播」，畫面裡的人已經死了，你立刻知道那是預錄的。你原本打算之後從逃生梯把手機放回他手上，讓現場看起來像他獨自發病、來不及求救；但 22:01 你藉口到正門外抽菸，經過保全室窗外，看到監視器螢幕亮回來了，拍得到逃生梯門。你回不去了，於是決定利用這段「他還活著」的錯覺。\n23:02 你用曜曜的手機在工作群組傳：「直播結束了。我先去休息室換衣服。合照你們先拍，不用等我。」手機螢幕一直亮著，很耗電。\n23:10 拍大合照時，口袋裡的手機震動，你只好低頭按掉。23:12 外面暴雨出不去、二樓又有監視器，你走進一樓男廁，把手機丟進水箱，打算之後再回收；那時電量只剩 2%。23:15 樓上傳來尖叫，有人發現他背上插著一把刀。\n【你不知道的事】\n・有人在曜曜的飲料裡下了安眠藥，你不知道是誰、什麼時候。\n・急救筆是誰拿走的。\n・他背上那一刀是誰捅的、為什麼。\n・為什麼會有一支預錄的直播影片可以播。\n・你是外部賓客，不知道廚房旁有一座員工貨梯通到二樓。","intro":"// 必須公開：今晚代表晨禾生技出席，合照時站在最後一排。\n// 被問到中場去哪時的說詞：21:05～21:45 在停車場自己車上講工作電話。","cover":"21:05～21:45 的說詞：「在停車場自己車上講工作電話。」被揭穿刑警身分時：「我離席是去查洗錢案。」","goal":"讓大家相信曜曜死於 23:00 之後，或是廚房疏失；讓黑粉或洗錢集團頂罪；隱藏刑警身分。","clue":{"prompt":"組長照「老規矩」把專案代號寫成一串數字傳給你。\n看 LINE、備忘錄和相簿，輸入專案代號（英文字母）：","answers":["STREAM"],"reveal":"專案代號確認：STREAM（直播斗內洗錢專案）。\n你是這個專案的成員，但你今晚做的每一件事都不在專案裡。\n\n你必須避免被查到的三件事：\n1. 你的真實身分：刑警林子杰，林語涵的哥哥。\n2. 停在逃生梯正下方 6 號車格的租車（RBK-7316）。21:10～21:45 你一直在那台車和逃生梯之間進出。\n3. 一樓男廁水箱裡的曜曜手機。23:12 你把它丟進去時，電量只剩 2%。","solution":"對照掩護名片英文面：第 1 行 CHENHEBIOTECH、第 2 行 SALESMANAGER；2-1 S、1-10 T、2-12 R、1-3 E、2-2 A、2-6 M → STREAM。"}},"messages":[{"with":"組長","last":"新聞說山路落石封閉，你那邊還好嗎？","items":[{"day":"10月16日"},{"t":"21:10","x":"專案代號更新，照老規矩：2-1 1-10 2-12 1-3 2-2 2-6"},{"t":"21:11","x":"之後回報都用這個開頭。"},{"me":true,"t":"21:13","x":"收到。"},{"day":"今天"},{"t":"18:30","x":"上山了？那邊收訊很爛，用 LINE 回報。"},{"me":true,"t":"18:41","x":"快到了，霧很大。"},{"t":"18:42","x":"記住，你的任務是金流。別的事不要碰。"},{"me":true,"t":"18:45","x":"知道。"},{"t":"22:10","x":"有沒有看到榜一跟合夥人接觸？"},{"me":true,"t":"22:14","x":"還沒。"},{"t":"23:35","x":"新聞說山路落石封閉，你那邊還好嗎？"}]},{"with":"語涵","last":"哥，你今天會很晚嗎","items":[{"day":"10月15日"},{"t":"20:02","x":"醫生說我這個月可以試著自己去巷口買   const read = () => { try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; } catch(e) { return {}; } };
  const write = o => { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(o)); } catch(e) {} fire(); try { bc && bc.postMessage(1); } catch(e) {} };
  const subs = new Set();
  const fire = () => { const all = read(); subs.forEach(f => f(all)); };
  if (bc) bc.onmessage = fire;
  addEventListener('storage', e => { if (e.key === LOCAL_KEY) fire(); });
  return {
    kind:'local',
    watch(fn){ subs.add(fn); fn(read()); return () => subs.delete(fn); },
    async set(path, data){ const o = read(); o[path] = data; write(o); },
    async merge(path, data){ const o = read(); o[path] = deepMerge(o[path] || {}, data); write(o); },
    async del(path){ const o = read(); delete o[path]; write(o); },
    async add(col, data){ const o = read(); o[col + '/' + Date.now().toString(36) + Math.random().toString(36).slice(2,6)] = data; write(o); },
    async clearPrefix(prefix){ const o = read(); Object.keys(o).forEach(k => k.startsWith(prefix) && delete o[k]); write(o); },
  };
})();
function deepMerge(a, b){ const o = Object.assign({}, a); Object.keys(b).forEach(k => { const v = b[k]; o[k] = (v && typeof v === 'object' && !Array.isArray(v) && o[k] && typeof o[k] === 'object' && !Array.isArray(o[k])) ? deepMerge(o[k], v) : v; }); return o; }
function Cloud(db, opt){
  opt = opt || {};
  const cache = {}; const subs = new Set(), listening = new Set();
  const fire = () => subs.forEach(f => f({...cache}));
  const listen = c => { if (listening.has(c)) return; listening.add(c); db.collection(c).onSnapshot(snap => {
    Object.keys(cache).forEach(k => k.startsWith(c + '/') && delete cache[k]);
    snap.docs.forEach(d => { if (d.exists) cache[c + '/' + d.id] = d.data(); });
    fire();
  }, () => {}); };
  (opt.cols || ['game','progress','players','events','votes','monitor']).forEach(listen);
  const docSubs = {};
  const listenDoc = (p, only) => { if (!db.docSnap || docSubs[p]) return; if (only) Object.keys(docSubs).forEach(k => { if (k.split('/')[0] === p.split('/')[0]) { docSubs[k](); delete docSubs[k]; delete cache[k]; } }); docSubs[p] = db.docSnap(p, d => { if (d.exists) cache[p] = d.data(); else delete cache[p]; fire(); }); };
  return {
    kind: opt.kind || 'cloud', listen, listenDoc: db.docSnap ? listenDoc : null,
    watch(fn){ subs.add(fn); fn({...cache}); return () => subs.delete(fn); },
    set(path, data){ return db.doc(path).set(data); },
    async merge(path, data){ if (db.mergeSet) return db.mergeSet(path, data); const s = await db.doc(path).get(); return s.exists ? db.doc(path).update(data) : db.doc(path).set(data); },
    del(path){ return db.doc(path).delete(); },
    add(col, data){ return db.collection(col).add(data); },
    async clearPrefix(prefix){ const col = prefix.replace(/\/$/, ''); const s = await db.collection(col).get(); const ids = s.docs.map(d => d.id); for (let i = 0; i < ids.length; i += 50) await Promise.all(ids.slice(i, i + 50).map(id => db.doc(col + '/' + id).delete())); },
  };
}

/* 投票準備：三分之二已登入玩家按「準備好了」就自動開放投票（DM 可關閉自動） */
const VOTE_RATIO = 2/3;
/* 開場人數：依人數決定哪些角色留下、哪些變 NPC、哪些由同一人分飾 */
const DROP_ORDER = ['C5','B4','A7','E4','B7','E2','C8','B1','A6','D3','B6','C2'];   // 人少時依序改成 NPC（不影響主線推理）
const MERGE_ORDER = [['B3','F1'],['C7','F2'],['F5','F6'],['C1','D5'],['D2','D4'],['C6','B5'],['E6','F3'],['E5','A2']]; // 再少時一人分飾兩角
const SETUP_MIN = 40 - DROP_ORDER.length - MERGE_ORDER.length, SETUP_FLOOR = 40 - DROP_ORDER.length;
function planFor(n){ n = Math.max(SETUP_MIN, Math.min(40, n | 0));
  const drop = DROP_ORDER.slice(0, Math.max(0, 40 - Math.max(n, SETUP_FLOOR))), merges = n < SETUP_FLOOR ? MERGE_ORDER.slice(0, SETUP_FLOOR - n) : [];
  const inM = new Set(merges.flat()), groups = [];
  ROSTER.forEach(([id]) => { if (drop.includes(id) || inM.has(id)) return; groups.push([id]); });
  merges.forEach(m => groups.push(m)); groups.sort((a, b) => a[0].localeCompare(b[0]));
  return { n, drop, groups }; }
const setup = () => { const st = game().setup; if (!st) return null; return Object.assign({}, st, { drop: st.drop || [], groups: (st.groups || []).map(g => Array.isArray(g) ? g : String(g).split('+')) }); };
const groupOf = id => { const st = setup(); const g = st && st.groups.find(x => x.includes(id)); return g && g.length > 1 ? g : [id]; };
const isActive = id => { const st = setup(); return !st || !st.drop.includes(id); };
const personKey = id => { const st = setup(); if (st) { const g = st.groups.find(x => x.includes(id)); if (g) return 'P:' + g.join('+'); } return ((player(id).name || '').trim()) || id; };
const readyCount = () => { const act = ROSTER.filter(([id]) => isActive(id) && rosterOf(id).login);
  const people = new Map(); act.forEach(([id]) => { const k = personKey(id); people.set(k, (people.get(k) || false) || !!rosterOf(id).ready); });
  return [[...people.values()].filter(Boolean).length, people.size]; };
async function clearReady(){ const r = {}; ROSTER.forEach(([id]) => { if (rosterOf(id).ready) r[id] = Object.assign({}, rosterOf(id), { ready: false }); }); if (Object.keys(r).length) { try { await store.merge('game/state', { roster: r }); } catch(e) {} } }
let autoVoteFired = false;
function checkAutoVote(){ const g = game(); if ((g.phase || 'play') !== 'play' || g.autoVote === false || autoVoteFired) return;
  const [n, t] = readyCount(); if (t >= 2 && n >= Math.ceil(t * VOTE_RATIO)) { autoVoteFired = true;
    store.merge('game/state', { phase: 'vote', announce: { text: '大部分玩家都準備好了，投票自動開放。', ts: 'autovote' } }).catch(() => { autoVoteFired = false; });
    const me = role(), leader = ROSTER.filter(([id]) => rosterOf(id).ready).map(([id]) => id).sort()[0];
    if (me && me.id === leader) { logEvent('系統', `${n}/${t} 位玩家準備好，自動開放投票`, 0); clearReady(); } } }

function switchPage(id){ const r = role(); if (!r || r.id === id || !groupOf(r.id).includes(id)) return;
  S.key = BYID[id].key; if (!PREVIEW) save(); lastProgSig = null; listenOwn(id); document.querySelectorAll('.win,.calling').forEach(w => w.remove()); renderHome(); }
const localGet = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const localSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };
function applyFsz(){ phone.style.setProperty('--fz', localGet('yao-fsz') || '1'); }
function onboarding(r){
  const steps = [['歡迎來到霧岑會館', '這支手機就是你的角色的手機。你看到的照片、訊息、備忘錄，都是你的角色真的擁有的東西。'], ['先看「身分文件」', '讀完你的角色，最下面的個人線索要先解謎。答案就藏在手機的其他 App 裡（照片記得按放大）。'], ['自我介紹要說「必須公開」那句', '其他事情可以隱瞞、也可以說謊。看不懂自己的線索，可以私下問 DM。'], ['紅點＝還沒看過', 'App 和照片上的小紅點代表你還沒打開過。推理得差不多時，到「案件簡報」按「我覺得可以投票了」。']];

/* 追蹤玩家看過的東西與目前畫面（給 DM 監看） */
let LOCAL_SEEN = (() => { try { return JSON.parse(localStorage.getItem('yao-seen') || '{}'); } catch(e) { return {}; } })(), screenT = 0, screenLast = 0, screenSig = '', seenDirty = false;
const mon = id => SH['monitor/' + id] || {};
function track(key){ const r = role(); if (!r || S.dm || PREVIEW) return; const L = LOCAL_SEEN[r.id] = LOCAL_SEEN[r.id] || {}; if (L[key]) return; L[key] = Date.now(); localSet('yao-seen', JSON.stringify(LOCAL_SEEN)); seenDirty = true; snapScreen(); }
function snapScreen(){ if (!seenDirty) return; clearTimeout(screenT); const wait = Math.max(1500, 30000 - (Date.now() - screenLast)); screenT = setTimeout(() => { const r = role(); if (!r || S.dm || PREVIEW || !seenDirty) return;

    const f = $(`<form class="locked"><div class="q">${esc(d.clue.prompt)}</div>

      if (!norm(f.querySelector('#clueans').value)) { f.querySelector('#cerr').textContent = '請先輸入答案。'; return; }
      if (d.clue.answers.includes(norm(f.querySelector('#clueans').value))) { await setFlag(r.id, 'solved', '解開個人線索', 1); setTimeout(draw, 50); toast('線索已解開', '內容已顯示在身分文件。', 'doc'); }

function appMsg(r){

function sceneHTML(ph){ return `<div class="pic scn">${sceneSVG(ph)}${ph.img ? `<img class="phimg" src="${esc(ph.img)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ''}</div>`; }
function photoViewer(ph, roleId){
  if (ph.pass && !flags(roleId)['pass_' + ph.title]) {
    const w = $(`<form><div class="big">${sceneHTML(Object.assign({}, ph, { desc: '' }))}</div><p class="phdesc">${esc(ph.lockedDesc || '這個相簿上了密碼。')}</p><div class="field"><input id="pp" aria-label="相簿密碼" autocomplete="off"><button class="btn" type="submit">打開</button></div><div class="err" id="pe"></div></form>`);
    w.addEventListener('submit', async e => { e.preventDefault(); if (norm(w.querySelector('#pp').value) === norm(ph.pass)) { await setFlag(roleId, 'pass_' + ph.title, '打開「' + ph.title + '」', 0); w.replaceWith(photoViewer(Object.assign({}, ph, { pass: null }), roleId)); } else w.querySelector('#pe').textContent = '密碼不對。'; });
    return w; }
  if (ph.lockZoom && !(anyFlag(ph.unlockAny || []) || (game().yaoHolder && (ph.unlockAny || []).some(k => k.startsWith('yao'))))) ph = Object.assign({}, ph, { zoom: ph.lockZoom, flag: null });
  const wrap = $(`<div><div class="big zoomwrap2">${sceneHTML(ph)}</div><p class="phdesc">${esc(ph.desc || '')}</p>
    ${ph.zoom ? `<button class="btn ghost sm" id="zb">🔍 放大 3 倍</button><div class="zoomtxt" id="zt" hidden>放大後看到：${esc(ph.zoom)}</div>` : ''}
    <p style="color:var(--mute);font-size:12.5px">拍攝時間 ${esc(ph.t)}</p></div>`);
  const zb = wrap.querySelector('#zb');
  if (zb) zb.addEventListener('click', () => { track('z:' + ph.title); snapScreen(); wrap.querySelector('#zt').hidden = false; zb.hidden = true; wrap.querySelector('.pic').classList.add('zoomed'); if (ph.flag) setFlag(roleId, ph.flag[0], ph.flag[2], ph.flag[1]); });
  return wrap;
}
function appPhoto(r){
  if (!r.photos || !r.photos.length) { win('相簿', $(`<p style="color:var(--mute)">沒有照片。</p>`), renderHome); return; }
  const g = $(`<div class="photos"></div>`);
  const seen = Object.assign({}, mon(r.id).seen || {}, LOCAL_SEEN[r.id] || {});
  r.photos.forEach(ph => { const b = $(`<button class="thumb">${sceneHTML(ph)}<div class="cap">${seen['v:' + ph.title] ? '' : '<span class="dot sm"></span>'}${esc(ph.t)}　${esc(ph.title)}${ph.zoom && !seen['z:' + ph.title] && seen['v:' + ph.title] ? ' <small class="zhint">可放大</small>' : ''}</div></button>`);
    b.addEventListener('click', () => win(ph.title, photoViewer(ph, r.id))); g.appendChild(b); });
  win('相簿', g, renderHome);
}

/* 會館市話（只有保全）：撥 119，消防員先問狀況 */
function appTel(r){
  const wrap = $(`<div class="dial"><div class="pin" style="align-self:stretch">保全室市話，可以撥外線。</div><div class="num">119</div><button class="callbtn" aria-label="撥打 119">${ICONS.phone}</button></div>`);
  wrap.querySelector('.callbtn').addEventListener('click', () => {
    const c = callScreen('119 消防局', '接通中…'); const tr = c.querySelector('.transcript');
    const say = (who, text) => { tr.appendChild($(`<p><b>${esc(who)}</b>　${esc(text)}</p>`)); tr.scrollTop = tr.scrollHeight; };
    setTimeout(() => {
      c.querySelector('.st').textContent = '通話中';
      say('消防員', '這裡是消防局。山路落石封閉，我們天亮前上不去。我先問幾個問題，請照實回答。');
      const Q = [
        ['傷者的皮膚摸起來？', ['溫熱', '涼涼的', '冰冷僵硬'], 1],
        ['刀口附近的出血量？', ['大量出血', '幾乎沒什麼血'], 1],
        ['傷者的臉和嘴唇？', ['正常', '腫脹', '發白'], 1],
      ];
      const ans = []; let qi = 0;
      const ask = () => {
        if (qi >= Q.length) {
          const ok = Q.every((q, i) => ans[i] === q[2]);
          if (ok) { say('消防員', '刀口沒什麼血、皮膚已經涼了，代表被刺的時候人應該已經死了一段時間。臉和嘴唇腫脹，比較像嚴重過敏。'); say('消防員', '請不要移動遺體、保持現場，等警方天亮上山。'); setFlag(r.id, 'fire119', '撥 119 得到消防員判斷（死後才被刺、像過敏）', 2); }
          else { say('消防員', '這些狀況兜不起來……請再仔細確認一下現場，或問問看到遺體的人，再打過來。'); logEvent(r.id, '撥 119，但回答的現場狀況不正確', 0); }
          return;
        }
        const q = Q[qi]; say('消防員', q[0]);
        const ch = $(`<div class="choices">${q[1].map((o,i) => `<button data-i="${i}">${esc(o)}</button>`).join('')}</div>`);
        ch.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { ans[qi] = +b.dataset.i; ch.remove(); say('你', q[1][ans[qi]]); qi++; setTimeout(ask, 500); }));
        tr.appendChild(ch); tr.scrollTop = tr.scrollHeight;
      };
      setTimeout(ask, 700);
    }, 1100);
  });
  win('會館市話', wrap, renderHome);
}

function npcTalk(r, id){
  const n = NPC[id], w = $(`<div class="npc"><div class="note"><div class="meta">他自我介紹時說</div><p>「${esc(n.pub)}」</p></div><div class="qs"></div><div class="log npclog"></div>
    <form class="field" id="np"><input id="nq" placeholder="追問：輸入你手上的證據關鍵字" aria-label="追問關鍵字" style="text-transform:none"><button class="btn" type="submit">追問</button></form></div>`);
  const log = w.querySelector('.npclog'), say = (q, a) => { log.prepend($(`<div><time>${esc(nowHM())}</time><span><b>你：</b>${esc(q)}<br><b>${esc(BYID[id].title)}：</b>${esc(a)}</span></div>`)); };
  n.qa.forEach(([q, a]) => { const b = $(`<button class="btn ghost sm" style="margin:0 6px 6px 0">${esc(q)}</button>`); b.addEventListener('click', () => { say(q, a); logEvent(r.id, `問 NPC ${BYID[id].title}：${q}`, 0, { npc: id, q }); track('npc:' + id); snapScreen(); }); w.querySelector('.qs').appendChild(b); });
  w.querySelector('#np').addEventListener('submit', e => { e.preventDefault(); const q = w.querySelector('#nq').value.trim(); if (!q) return;
    const hit = (n.press || []).find(([ks]) => ks.some(k => q.toLowerCase().includes(k.toLowerCase())));
    say('（追問）' + q, hit ? hit[1] : '他皺了皺眉：「你在說什麼？我聽不懂。」'); logEvent(r.id, `追問 NPC ${BYID[id].title}：「${q}」${hit ? '（他鬆口了）' : ''}`, hit ? 2 : 0, { npc: id, q, press: true, hit: !!hit }); w.querySelector('#nq').value = ''; snapScreen(); });
  win(BYID[id].title, w);
}

  const cv = wrap.querySelector('canvas'), ctx = cv.getContext('2d'), scrub = wrap.querySelector('.scrub'), capEl = wrap.querySelector('.cctvcap');
  let t = T0, playing = false, last = 0, raf = 0, logged = false, zoom = null, ch = '2', frame = 0;

/* Firebase 資料層（正式場用；填入 FIREBASE_CONFIG 才會啟用） */
function loadScript(src){ return new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); }); }
async function FirebaseStore(cfg){
  await loadScript('https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js');
  await loadScript('https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js');
  const app = firebase.initializeApp(cfg), fs = firebase.firestore(app);
  return Cloud({
    mergeSet: (p, d) => fs.doc(p).set(d, { merge: true }),
    docSnap: (p, n) => fs.doc(p).onSnapshot(d => n({ exists: d.exists, data: () => d.data() }), () => {}),
    collection: c => ({ onSnapshot: (n, e) => (c === 'events' ? fs.collection(c).orderBy('ts', 'desc').limit(300) : fs.collection(c)).onSnapshot(snap => n({ docs: snap.docs.map(d => ({ id: d.id, exists: true, data: () => d.data() })) }), e),
      get: async () => { const snap = await fs.collection(c).get(); return { docs: snap.docs.map(d => ({ id: d.id })) }; },
      add: d => fs.collection(c).add(d) }),
    doc: p => ({ get: async () => { const x = await fs.doc(p).get(); return { exists: x.exists }; }, set: d => fs.doc(p).set(d), update: d => fs.doc(p).set(d, { merge: true }), delete: () => fs.doc(p).delete() }),
  }, { kind: 'firebase', cols: S.dm ? ['game','progress','players','votes','events','monitor'] : ['game','players','votes'] });
}
